<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0C0A">
  <title>Terminal de Barista (KDS) | MJ CAFÉ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  
  <style>
    body {
      background-color: var(--color-bg);
      color: var(--color-text-body);
    }
    .kds-header {
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .kds-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .kds-summary-bar {
      max-width: 1400px;
      margin: 16px auto 0;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .kds-stat-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kds-stat-label {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      font-weight: 600;
    }
    .kds-stat-value {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-accent);
    }
    .kds-columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding: 18px 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .kds-col {
      background-color: var(--color-surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      min-height: 420px;
      max-height: calc(100vh - 190px);
    }
    .kds-col-header {
      padding: 14px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-pendiente { border-top: 3px solid var(--color-warning-text); }
    .col-preparando { border-top: 3px solid var(--color-accent); }
    .col-listo { border-top: 3px solid var(--color-success-text); }
    
    .kds-col-body {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .order-card {
      background-color: var(--color-surface-elevated);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      padding: 14px;
      box-shadow: var(--shadow-subtle);
    }
    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--color-border);
      padding-bottom: 8px;
    }
    .order-folio {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color-accent);
    }
    .order-client {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--color-text);
    }
    .order-time-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-body);
    }
    .order-items-list {
      list-style: none;
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .order-item-row {
      font-size: 0.85rem;
      color: var(--color-text);
      display: flex;
      justify-content: space-between;
    }
    .order-item-custom {
      font-size: 0.76rem;
      color: var(--color-accent);
      padding-left: 10px;
    }
    .order-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .order-actions button {
      flex: 1;
      padding: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
    }
    
    .kds-mobile-tabs {
      display: none;
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 8px 16px;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .kds-mobile-tabs::-webkit-scrollbar {
      display: none;
    }
    .kds-tab-btn {
      flex-shrink: 0;
      white-space: nowrap;
      background: var(--color-surface-elevated);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .kds-tab-btn.active {
      background: var(--color-accent);
      color: #0D0C0A;
      border-color: var(--color-accent);
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .kds-mobile-tabs {
        display: flex;
      }
      .kds-header {
        padding: 12px 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .kds-title {
        font-size: 1.05rem;
      }
      .kds-header-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        gap: 8px;
      }
      .kds-summary-bar {
        padding: 0 16px;
        margin-top: 12px;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
      }
      .kds-summary-bar .kds-stat-card:last-child {
        grid-column: 1 / -1;
      }
      .kds-columns {
        grid-template-columns: 1fr;
        padding: 14px 16px;
        gap: 14px;
      }
      .kds-col {
        max-height: none;
        min-height: auto;
      }
      
      .kds-columns[data-filter="col-pendiente"] .kds-col:not(.col-pendiente) {
        display: none !important;
      }
      .kds-columns[data-filter="col-preparando"] .kds-col:not(.col-preparando) {
        display: none !important;
      }
      .kds-columns[data-filter="col-listo"] .kds-col:not(.col-listo) {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <header class="kds-header">
    <div class="kds-title">
      <div>
        <div>MJ CAFÉ • Terminal de Cocina (KDS)</div>
        <div style="font-size: 0.72rem; font-family: var(--font-sans); font-weight: 500; color: var(--color-text-muted);">
          Gestión de comandas en tiempo real • FES Cuautitlán Campo 4
        </div>
      </div>
    </div>

    <div class="kds-header-actions">
      <span id="kds-last-sync" style="font-size: 0.78rem; font-family: var(--font-mono); color: var(--color-text-muted);">Sincronizando...</span>
      <button id="btn-reset-demo" class="btn btn-outline" style="padding: 7px 12px; font-size: 0.8rem;" title="Restaurar comandas de ejemplo en modo local">
        Restablecer Demo
      </button>
      <button id="btn-refresh-kds" class="btn btn-outline" style="padding: 7px 12px; font-size: 0.8rem;">
        Actualizar
      </button>
      <a href="db_viewer.html" class="btn btn-outline" style="padding: 7px 12px; font-size: 0.8rem;" title="Ver registros en SQLite">
        Base de Datos
      </a>
      <a href="index.html" class="btn btn-primary" style="padding: 7px 14px; font-size: 0.8rem;">
        Volver a la Tienda
      </a>
    </div>
  </header>

  <section class="kds-summary-bar">
    <div class="kds-stat-card">
      <span class="kds-stat-label">Comandas en Cola</span>
      <span class="kds-stat-value" id="stat-activos">0</span>
    </div>
    <div class="kds-stat-card">
      <span class="kds-stat-label">Entregados Hoy</span>
      <span class="kds-stat-value" id="stat-entregados">0</span>
    </div>
    <div class="kds-stat-card">
      <span class="kds-stat-label">Venta del Turno</span>
      <span class="kds-stat-value" id="stat-ingresos">$0.00 MXN</span>
    </div>
  </section>

  <!-- Pestañas móviles de filtro para baristas -->
  <nav class="kds-mobile-tabs" id="kds-mobile-tabs" aria-label="Filtro de comandas">
    <button class="kds-tab-btn active" data-col="all">Todos (<span id="mob-stat-total">0</span>)</button>
    <button class="kds-tab-btn" data-col="col-pendiente">Nuevos (<span id="mob-count-pendientes">0</span>)</button>
    <button class="kds-tab-btn" data-col="col-preparando">En Preparación (<span id="mob-count-preparando">0</span>)</button>
    <button class="kds-tab-btn" data-col="col-listo">Listos (<span id="mob-count-listo">0</span>)</button>
  </nav>

  <main class="kds-columns">
    <div class="kds-col col-pendiente">
      <div class="kds-col-header">
        <span>Nuevos por Preparar</span>
        <span id="count-pendientes" class="cart-count" style="background: var(--color-warning-text);">0</span>
      </div>
      <div class="kds-col-body" id="col-body-pendientes"></div>
    </div>

    <div class="kds-col col-preparando">
      <div class="kds-col-header">
        <span>En Barra / Preparación</span>
        <span id="count-preparando" class="cart-count" style="background: var(--color-accent);">0</span>
      </div>
      <div class="kds-col-body" id="col-body-preparando"></div>
    </div>

    <div class="kds-col col-listo">
      <div class="kds-col-header">
        <span>Listos para Recoger</span>
        <span id="count-listo" class="cart-count" style="background: var(--color-success-text);">0</span>
      </div>
      <div class="kds-col-body" id="col-body-listo"></div>
    </div>
  </main>

  <script type="module">
    import { API } from '../js/api.js';

    async function cargarPedidosKds() {
      const res = await API.obtenerPedidosCocina();
      const pedidos = res.pedidos || [];
      const resumen = res.resumen || { total_pedidos: pedidos.length, ingresos_totales: 0, entregados: 0 };

      const colPendientes = document.getElementById('col-body-pendientes');
      const colPreparando = document.getElementById('col-body-preparando');
      const colListo = document.getElementById('col-body-listo');

      colPendientes.innerHTML = '';
      colPreparando.innerHTML = '';
      colListo.innerHTML = '';

      let cPendiente = 0, cPrep = 0, cListo = 0;

      pedidos.forEach(p => {
        const card = document.createElement('div');
        card.className = 'order-card';

        const itemsHtml = (p.items || []).map(i => `
          <li>
            <div class="order-item-row">
              <strong>${i.cantidad}x ${i.producto_nombre}</strong>
            </div>
            ${i.personalizaciones ? `<div class="order-item-custom">↳ ${i.personalizaciones}</div>` : ''}
          </li>
        `).join('');

        card.innerHTML = `
          <div class="order-card-header">
            <div>
              <div class="order-folio">${p.folio}</div>
              <div class="order-client">${p.cliente_nombre} (${p.cliente_telefono})</div>
            </div>
            <div class="order-time-badge">${p.hora_recoleccion_estimada}</div>
          </div>

          <ul class="order-items-list">
            ${itemsHtml}
          </ul>

          ${p.notas ? `<div style="font-size: 0.78rem; background: var(--color-surface); border: 1px solid var(--color-border); padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; color: var(--color-text-muted);"><em>Nota: "${p.notas}"</em></div>` : ''}

          <div style="font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 8px;">
            Total: <strong style="color: var(--color-text); font-family: var(--font-mono);">$${Number(p.total).toFixed(2)} MXN</strong> (${p.metodo_pago === 'efectivo_en_barra' ? 'Efectivo' : 'SPEI'})
          </div>

          <div class="order-actions">
            ${p.estado === 'pendiente' ? `
              <button class="btn btn-primary btn-action-state" data-id="${p.id}" data-state="preparando">Iniciar Preparación</button>
            ` : ''}
            ${p.estado === 'preparando' ? `
              <button class="btn btn-primary btn-action-state" style="background: var(--color-success); border-color: var(--color-success); color: #fff;" data-id="${p.id}" data-state="listo_para_recoger">Marcar Listo</button>
            ` : ''}
            ${p.estado === 'listo_para_recoger' ? `
              <button class="btn btn-outline btn-action-state" data-id="${p.id}" data-state="entregado">Entregar Pedido</button>
            ` : ''}
          </div>
        `;

        if (p.estado === 'pendiente') {
          colPendientes.appendChild(card);
          cPendiente++;
        } else if (p.estado === 'preparando') {
          colPreparando.appendChild(card);
          cPrep++;
        } else if (p.estado === 'listo_para_recoger') {
          colListo.appendChild(card);
          cListo++;
        }
      });

      const emptyStateHtml = '<div style="text-align: center; padding: 32px 12px; color: var(--color-text-muted); font-size: 0.84rem; border: 1px dashed var(--color-border); border-radius: var(--radius-sm);">Sin comandas en esta etapa</div>';
      if (cPendiente === 0) colPendientes.innerHTML = emptyStateHtml;
      if (cPrep === 0) colPreparando.innerHTML = emptyStateHtml;
      if (cListo === 0) colListo.innerHTML = emptyStateHtml;

      document.getElementById('count-pendientes').textContent = cPendiente;
      document.getElementById('count-preparando').textContent = cPrep;
      document.getElementById('count-listo').textContent = cListo;

      const mobPend = document.getElementById('mob-count-pendientes');
      const mobPrep = document.getElementById('mob-count-preparando');
      const mobListo = document.getElementById('mob-count-listo');
      const mobTotal = document.getElementById('mob-stat-total');

      if (mobPend) mobPend.textContent = cPendiente;
      if (mobPrep) mobPrep.textContent = cPrep;
      if (mobListo) mobListo.textContent = cListo;
      if (mobTotal) mobTotal.textContent = pedidos.length;

      document.getElementById('stat-activos').textContent = pedidos.length;
      document.getElementById('stat-entregados').textContent = resumen.entregados || 0;
      document.getElementById('stat-ingresos').textContent = `$${Number(resumen.ingresos_totales || 0).toFixed(2)} MXN`;
      document.getElementById('kds-last-sync').textContent = new Date().toLocaleTimeString();

      document.querySelectorAll('.btn-action-state').forEach(b => {
        b.addEventListener('click', async (e) => {
          const id = e.currentTarget.dataset.id;
          const state = e.currentTarget.dataset.state;
          e.currentTarget.disabled = true;
          e.currentTarget.textContent = 'Actualizando...';
          await API.actualizarEstadoCocina(id, state);
          await cargarPedidosKds();
        });
      });
    }

    // Inicializar navegación por pestañas en móvil
    document.querySelectorAll('.kds-tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.kds-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const target = btn.dataset.col;
        const columns = document.querySelector('.kds-columns');
        if (target === 'all') {
          columns.removeAttribute('data-filter');
        } else {
          columns.setAttribute('data-filter', target);
        }
      });
    });

    document.getElementById('btn-reset-demo').addEventListener('click', async () => {
      localStorage.removeItem('mj_cafe_pedidos_v1');
      await cargarPedidosKds();
    });

    document.getElementById('btn-refresh-kds').addEventListener('click', cargarPedidosKds);
    cargarPedidosKds();
    setInterval(cargarPedidosKds, 10000);
  </script>
</body>
</html>
